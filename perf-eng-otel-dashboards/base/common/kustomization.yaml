apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
- name: dashboards-common
  files:
  - dashboards/perf-demo-web.json

  options:
    annotations:
      k8s-sidecar-target-directory: "/var/lib/grafana/dashboards/demo-perf"
    labels:
      grafana_dashboard: "1"

- name: alerts-common
  files:
  # generated from baselines/*.json — re-run tools/gen-alerts.mjs, never hand-edit
  - alerts/redline-red-lines.json

  options:
    annotations:
      argocd.argoproj.io/sync-wave: "0"
    labels:
      grafana_alert: "1"

- name: alerts-common-tombstone
  files: # - tombstone/delete-common-alert.json

  options:
    annotations:
      argocd.argoproj.io/sync-wave: "1"
    labels:
      grafana_alert: "1"
