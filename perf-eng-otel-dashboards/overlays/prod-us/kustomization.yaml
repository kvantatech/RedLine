apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namePrefix: demo-perf-

resources:
  - ../common-prod

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: dashboards-prod-us
    files:
    # - dashboards/prod-us-dashboard.json
    options:
      annotations:
        k8s-sidecar-target-directory: "/var/lib/grafana/dashboards/demo-perf"
      labels:
        grafana_dashboard: "1"

  - name: alerts-prod-us
    files:
    # - alerts/prod-us-alert.json
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "0"
      labels:
        grafana_alert: "1"

  - name: alerts-prod-us-tombstone
    files:
    # - tombstone/delete-prod-us-alert.json
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "1"
      labels:
        grafana_alert: "1"
