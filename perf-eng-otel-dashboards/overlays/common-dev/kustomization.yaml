apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/common

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: dashboards-common-dev
    files:
    # - dashboards/common-dev-dashboard.json
    options:
      annotations:
        k8s-sidecar-target-directory: "/var/lib/grafana/dashboards/demo-perf"
      labels:
        grafana_dashboard: "1"

  - name: alerts-common-dev
    files:
    # - alerts/common-dev-alert.json
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "0"
      labels:
        grafana_alert: "1"

  - name: alerts-common-dev-tombstone
    files:
    # - tombstone/delete-common-dev-alert.json
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "1"
      labels:
        grafana_alert: "1"
