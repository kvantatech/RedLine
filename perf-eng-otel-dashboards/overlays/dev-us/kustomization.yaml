apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namePrefix: demo-perf-

resources:
  - ../common-dev

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: dashboards-dev-us
    files:
    # - dashboards/dev-us-dashboard.json
    options:
      annotations:
        k8s-sidecar-target-directory: "/var/lib/grafana/dashboards/demo-perf"
      labels:
        grafana_dashboard: "1"

  - name: alerts-dev-us
    files:
    # - alerts/dev-us-alert.json
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "0"
      labels:
        grafana_alert: "1"

  - name: alerts-dev-us-tombstone
    files:
    # - tombstone/delete-dev-us-alert.json
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "1"
      labels:
        grafana_alert: "1"
