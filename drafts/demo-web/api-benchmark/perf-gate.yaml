# demo-web · api-benchmark profile — gate thresholds
# Source of truth: baselines/demo-web.api-benchmark.json

team: demo-web
profile: api-benchmark
env: stg
script: demo-web/api-benchmark/script.js   # relative to live/

thresholds:
  - metric: demo_web_config_health     # GET /api/config only — login excluded
    p95_red_ms: 1000                 # single threshold; green/red only

gate:
  mode: report-only                  # report-only → enforce after burn-in sign-off
  exit_code_on_red: 99             # k6-native thresholds-failed code; 97 is reserved for crash/abort
