# quickpizza-team · api-benchmark profile — gate thresholds
# Source of truth: baselines/quickpizza-team.api-benchmark.json

team: quickpizza-team
profile: api-benchmark
env: stg
script: quickpizza-team/api-benchmark/script.js   # relative to live/

thresholds:
  - metric: quickpizza_config_health   # GET /api/config — bootstrap signal
    p95_red_ms: 1000                   # single threshold; green/red only
  - metric: quickpizza_pizza_order     # POST /api/pizza — core transaction
    p95_red_ms: 1000

gate:
  mode: report-only                    # new team starts report-only (burn-in rule)
  exit_code_on_red: 99                 # k6-native thresholds-failed code; 97 reserved for crash
