team: demo-web
profile: load
script: demo-web/load/script.js   # relative to live/
gate_mode: report-only           # promote to enforce after 2-week burn-in (see docs/test-suite-policy.md)
trigger: every-prod-deploy-pre-promote
environments:
  - stg                          # staging only — never prod (see test-suite-policy.md)

thresholds:
  - metric: demo_web_config_health
    p95_ms: 900
    note: GET /api/config p95 under expected concurrency (10 VUs)

  - metric: http_req_failed
    rate_max: 0.01
    note: Error rate must stay under 1%
